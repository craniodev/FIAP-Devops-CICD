[pytest]
# src/ e tests/ no PYTHONPATH: os testes importam rag, handler e metricas direto.
pythonpath = src tests
testpaths = tests
# Por padrao roda so o que e offline. O pos-deploy precisa da API no ar e e
# chamado explicitamente com: pytest -m posdeploy
addopts = -m "not posdeploy" -p no:cacheprovider
markers =
    posdeploy: avaliacao contra a API implantada (precisa de ASSISTENTE_URL)
junit_family = xunit2
