[pytest]
# -ra: o fim do log do job lista o motivo de cada teste que falhou, sem precisar
# rolar a saida inteira. --tb=line evita traceback longo quando algo quebra fora
# das verificacoes (ex.: arquivo do plan ausente). --capture=tee-sys mostra ao vivo
# no log do job a espera do smoke pelo ALB (ate 5 min) e ainda guarda no relatorio.
addopts = -ra --tb=line --capture=tee-sys
# Nome da suite no relatorio JUnit: e o titulo que aparece na aba Tests do GitLab.
junit_suite_name = trabalho-final
# O botocore do runner usa datetime.utcnow(), que o Python 3.12 marca como
# obsoleto; o aviso nao diz nada sobre o trabalho e so polui o log.
filterwarnings =
    ignore::DeprecationWarning:botocore.*
